name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_BRANCH: main
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m py_compile auto_pipeline.py dashboard.py db.py download_vod.py monitor.py progress.py retry.py thumbnail.py twitch_api.py utils.py youtube_uploader.py
          python -m unittest discover -s tests

      - name: Build Docker image
        run: docker build -t twitch-vod-auto:test .

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for secret_name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required repository secret: $secret_name"
              exit 1
            fi
          done

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          port="${VPS_PORT:-22}"
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          path="${DEPLOY_PATH:-/opt/twitch-vod-auto}"

          ssh -i ~/.ssh/deploy_key -p "$port" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_PATH='$path' DEPLOY_BRANCH='$DEPLOY_BRANCH' bash -s" <<'EOF'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          if [ ! -d .git ]; then
            echo "ERROR: $DEPLOY_PATH no es un clon Git. Clona el repo en el VPS antes del deploy."
            exit 1
          fi

          current_branch="$(git branch --show-current)"
          if [ "$current_branch" != "$DEPLOY_BRANCH" ]; then
            echo "ERROR: el VPS esta en la rama '$current_branch', pero produccion espera '$DEPLOY_BRANCH'."
            exit 1
          fi

          if [ ! -f config.prod.local.json ] && [ -f config.json ]; then
            cp config.json config.prod.local.json
            echo "Creado config.prod.local.json desde config.json existente."
          fi

          git pull --ff-only origin "$DEPLOY_BRANCH"

          if [ ! -f config.prod.local.json ]; then
            echo "ERROR: falta config.prod.local.json en el VPS."
            echo "Crea el archivo con: cp config.prod.json config.prod.local.json"
            exit 1
          fi

          for required_file in .env client_secret.json youtube_credentials.pkl; do
            if [ ! -f "$required_file" ]; then
              echo "WARNING: falta $required_file en produccion."
            fi
          done
          if [ ! -f secrets/twitch_cookies.txt ]; then
            echo "WARNING: falta secrets/twitch_cookies.txt; las descargas privadas pueden fallar sin cookies."
          fi

          mkdir -p data logs downloads certbot-data certbot-www secrets
          docker compose -f docker-compose.prod.yml up --build -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
          EOF
