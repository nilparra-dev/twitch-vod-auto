name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main # main se valida y despliega en deploy-production.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy, advisory)
        run: mypy .
        continue-on-error: true # tipado gradual: informativo, aun no bloqueante

      - name: Tests with coverage
        run: python -m pytest --cov=. --cov-report=term-missing

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t twitch-vod-auto:ci .
