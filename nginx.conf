# Nginx reverse proxy para Twitch VOD Auto
# IMPORTANTE: Cambia 'vod.privatevods.com' por tu subdominio real

server {
    listen 80;
    server_name vod.privatevods.com;

    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot ACME challenge (para renovacion automatica SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name vod.privatevods.com;

    # SSL Certificates (generados por Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vod.privatevods.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vod.privatevods.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dashboard (FastAPI)
    location / {
        proxy_pass http://twitch-vod-dashboard:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://twitch-vod-dashboard:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
