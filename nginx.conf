# Nginx reverse proxy para Twitch VOD Auto
# IMPORTANTE: Cambia 'vod.privatevods.com' por tu subdominio real

server {
    listen 80;
    server_name vod.privatevods.com;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot ACME challenge (para renovacion automatica SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name vod.privatevods.com;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dashboard_upstream twitch-vod-dashboard:8080;

    # SSL Certificates (generados por Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vod.privatevods.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vod.privatevods.com/privkey.pem;

    # TLS endurecido (origen). El TLS publico lo termina Cloudflare.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- IP real del cliente tras Cloudflare ---
    # Solo se confia en CF-Connecting-IP cuando la conexion viene de rangos de
    # Cloudflare; asi $remote_addr (y X-Real-IP) es la IP real del cliente y el
    # rate-limit de login no se puede saltar falsificando cabeceras.
    # Refrescar desde https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Las cabeceras de seguridad (X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, CSP, HSTS) las fija la app FastAPI en un unico sitio
    # para evitar duplicados y descoordinacion.

    # Dashboard (FastAPI)
    location / {
        proxy_pass http://$dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://$dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
