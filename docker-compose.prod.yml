version: "3.9"

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-vod-pipeline
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./downloads:/app/downloads
      - ./client_secret.json:/app/client_secret.json:ro
      - ./youtube_credentials.pkl:/app/youtube_credentials.pkl
      - ./twitch_cookies.txt:/app/twitch_cookies.txt:ro
      - ./config.prod.local.json:/app/config.json:ro
      - ./.env:/app/.env:ro
    environment:
      - CONFIG_PATH=/app/config.json
      - PYTHONUNBUFFERED=1
    command: ["python", "auto_pipeline.py"]
    networks:
      - vodnet

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-vod-dashboard
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.prod.local.json:/app/config.json:ro
    environment:
      - CONFIG_PATH=/app/config.json
      - PYTHONUNBUFFERED=1
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-cambia-esta-clave}
      - SECRET_KEY=${SECRET_KEY:-}
    command: ["python", "-m", "uvicorn", "dashboard:app", "--host", "0.0.0.0", "--port", "8080"]
    networks:
      - vodnet

  nginx:
    image: nginx:alpine
    container_name: twitch-vod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-data:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - dashboard
    networks:
      - vodnet

  certbot:
    image: certbot/certbot
    container_name: twitch-vod-certbot
    volumes:
      - ./certbot-data:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - vodnet

networks:
  vodnet:
    driver: bridge
