services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-vod-pipeline
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./downloads:/app/downloads
      - ./client_secret.json:/app/client_secret.json:ro
      - ./youtube_credentials.pkl:/app/youtube_credentials.pkl
      - ./secrets:/app/secrets:ro
      - ./config.prod.local.json:/app/config.json:ro
      - ./.env:/app/.env:ro
    environment:
      - CONFIG_PATH=/app/config.json
      - PYTHONUNBUFFERED=1
    command: ["python", "auto_pipeline.py"]
    networks:
      - vodnet

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-vod-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.prod.local.json:/app/config.json:ro
    environment:
      - CONFIG_PATH=/app/config.json
      - PYTHONUNBUFFERED=1
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD requerido en .env}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY requerido en .env}
      - COOKIE_SECURE=true
    command: ["python", "-m", "uvicorn", "dashboard:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - vodnet

  nginx:
    image: nginx:alpine
    container_name: twitch-vod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-data:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'"
    depends_on:
      - dashboard
    networks:
      - vodnet

  certbot:
    image: certbot/certbot
    container_name: twitch-vod-certbot
    volumes:
      - ./certbot-data:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - vodnet

networks:
  vodnet:
    driver: bridge
